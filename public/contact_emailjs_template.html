<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Portfolio Message</title>
    <style>
        /* Modern CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f8fafc;
            padding: 20px;
        }
        
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        .email-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .logo {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        
        .logo-subtitle {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 400;
        }
        
        .email-content {
            padding: 40px 30px;
        }
        
        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .message-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 25px;
            margin: 25px 0;
            border-left: 4px solid #3a86ff;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .info-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        
        .info-icon {
            width: 20px;
            height: 20px;
            color: #3a86ff;
            flex-shrink: 0;
            margin-top: 2px;
        }
        
        .info-content h3 {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        
        .info-content p {
            font-size: 16px;
            color: #1a202c;
            font-weight: 500;
        }
        
        .message-content {
            font-size: 16px;
            line-height: 1.7;
            color: #374151;
            white-space: pre-line;
        }
        
        .email-footer {
            background: #f1f5f9;
            padding: 25px 30px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }
        
        .footer-text {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .footer-meta {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            font-size: 13px;
        }
        
        .meta-icon {
            width: 14px;
            height: 14px;
        }
        
        .badge {
            display: inline-block;
            background: #3a86ff;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }
        
        /* Responsive Design */
        @media (max-width: 480px) {
            .email-content {
                padding: 30px 20px;
            }
            
            .email-header {
                padding: 30px 20px;
            }
            
            .info-grid {
                gap: 15px;
            }
            
            .footer-meta {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Header Section -->
        <div class="email-header">
            <div class="logo">NIVESH R</div>
            <div class="logo-subtitle">Portfolio Contact</div>
        </div>
        
        <!-- Content Section -->
        <div class="email-content">
            <h1 class="section-title">
                New Message Received 
                <span class="badge">New</span>
            </h1>
            
            <!-- Sender Information -->
            <div class="info-grid">
                <div class="info-item">
                    <svg class="info-icon" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path>
                    </svg>
                    <div class="info-content">
                        <h3>From</h3>
                        <p>{{user_name}}</p>
                    </div>
                </div>
                
                <div class="info-item">
                    <svg class="info-icon" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path>
                        <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path>
                    </svg>
                    <div class="info-content">
                        <h3>Email Address</h3>
                        <p>{{user_email}}</p>
                    </div>
                </div>
            </div>
            
            <!-- Message Content -->
            <div class="message-card">
                <div class="info-item">
                    <svg class="info-icon" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 5v8a2 2 0 01-2 2h-5l-5 4v-4H4a2 2 0 01-2-2V5a2 2 0 012-2h12a2 2 0 012 2zM7 8H5v2h2V8zm2 0h2v2H9V8zm6 0h-2v2h2V8z" clip-rule="evenodd"></path>
                    </svg>
                    <div class="info-content">
                        <h3>Message</h3>
                    </div>
                </div>
                <div class="message-content">
                    {{message}}
                </div>
            </div>
        </div>
        
        <!-- Footer Section -->
        <div class="email-footer">
            <p class="footer-text">
                This message was sent from your portfolio contact form at <a href="https://nivesh-portfolio-mu.vercel.app/">niveshr.com</a>
            </p>
        </div>
    </div>
</body>
</html>
